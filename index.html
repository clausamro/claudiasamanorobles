/* pick(str, lang): "es|en" strings choose by language */
const pick = (s,l) => s.includes("|") ? (l==="es" ? s.split("|")[0] : s.split("|")[1]) : s;

const entries = (items) => `<ul class="entries">${items.map(i=>`
  <li><span class="when">${i.when}</span>

const cites = (items,lang) => `<ul class="entries">${items.map(i=>`
  <li><span class="when">${pick(i.year,lang)}</span>
  <p class="cite">${i.text}${i.link?`<br><a class="doi" href="${i.link}" target="_blank" rel="noopener">${i.link.replace(/^https?:\/\//,"")}</a>`:""}</p></li>`).join("")}</ul>`;

const theses = (items,lang) => `<ul class="entries">${items.map(i=>`
  <li><span class="when">${pick(i.when,lang)}</span>
  <p class="what"><strong>${i.name}</strong><span class="sub">${i.title}${i.prog?` ${pick(i.prog,lang)}.`:""}</span></p></li>`).join("")}</ul>`;

  document.getElementById("main").innerHTML = `

    </details>
  </section>

    b.setAttribute("aria-pressed", String(b.dataset.lang===lang));
  });
  observeSections();

let obs;
function observeSections(){
  if(obs) obs.disconnect();
  const links = [...document.querySelectorAll("#nav a")];
  obs = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(l=>l.setAttribute("aria-current", String(l.getAttribute("href")==="#"+e.target.id)));
      }
    });
  },{rootMargin:"-25% 0px -65% 0px"});
  document.querySelectorAll("main section").forEach(s=>obs.observe(s));
}

function setLang(lang,store){
  render(lang);
  if(store){ try{ localStorage.setItem("cs-lang",lang); }catch(e){} }
}

let initial = "es";
try{
  const saved = localStorage.getItem("cs-lang");
  if(saved==="es"||saved==="en") initial = saved;
  else if((navigator.language||"").toLowerCase().startsWith("en")) initial = "en";
}catch(e){}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click",()=>setLang(b.dataset.lang,true));
});
setLang(initial,false);
</script>
